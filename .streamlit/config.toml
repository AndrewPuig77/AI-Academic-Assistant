[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#161f2e"
textColor = "#e5e7eb"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
